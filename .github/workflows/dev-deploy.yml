name: 'deploy'

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Cloning repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to dokku
        uses: dokku/github-action@master
        with:
          git_remote_url: 'ssh://dokku@app1.fabricadesoftware.ifc.edu.br:1022/painel-dev'
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          branch: dev
          # Histórico reescrito (repo novo): sem force o Dokku rejeita o push.
          force: true
