name: Deploy to Dokku

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 1022 app1.fabricadesoftware.ifc.edu.br >> ~/.ssh/known_hosts

      - name: Adicionar remote Dokku e fazer push
        run: |
          git remote add dokku "ssh://dokku@app1.fabricadesoftware.ifc.edu.br:1022/painel"
          git push dokku -vvv
