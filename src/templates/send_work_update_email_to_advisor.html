<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificação de Atualização de Dados</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            color: black;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .header {
            background-color: green;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }
        .content {
            padding: 20px;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #666;
        }
        .button {
            display: inline-block;
            padding: 10px 15px;
            margin: 10px 0;
            background-color: green;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .button:hover {
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Atualização de Dados</h1>
        </div>
        <div class="content">
            <p>Olá {{ advisor_name }},</p>
            <p>O conteúdo do trabalho <strong>{{ work_title }}</strong> foi alterado por {{ team_name }}!</p>
            <p>Para aceitar a nova submissão, clique no link abaixo:</p>
            <a href="{{ accept_work_link }}" class="button">Aceitar Submissão</a>
            <p>Para recusar, clique no link abaixo:</p>
            <a href="{{ reject_work_link }}" class="button">Recusar Submissão</a>
        </div>
        <div class="footer">
            <p>Obrigado por sua atenção!</p>
        </div>
    </div>
</body>
</html>
