<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: white;
            width: 297mm;
            height: 210mm;
            padding: 0;
            margin: 0;
        }

        .cert {
            background: white;
            border: 15px solid #1a1a1a;
            padding: 46px 60px 44px 60px;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .cert::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            bottom: 25px;
            border: 1px solid #8b7355;
            pointer-events: none;
        }

        .logos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .logo-ifc {
            max-width: 125px;
            height: auto;
            opacity: 0.9;
        }

        .logo-fabrica {
            max-width: 75px;
            height: auto;
            opacity: 0.9;
        }

        .header {
            text-align: center;
            margin-bottom: 14px;
        }

        h1 {
            font-size: 46px;
            color: #1a1a1a;
            letter-spacing: 12px;
            font-weight: normal;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-family: 'Times New Roman', serif;
        }

        .subtitle {
            font-size: 13px;
            color: #666;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: normal;
        }

        .content {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0;
            min-height: 0;
        }

        .intro {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            font-style: italic;
        }

        .user-name {
            font-size: 32px;
            color: #1a1a1a;
            font-weight: bold;
            margin: 10px 0;
            padding: 8px 20px;
            border-bottom: 2px solid #8b7355;
            text-align: center;
            min-width: 400px;
            max-width: 700px;
            word-wrap: break-word;
        }

        .participation {
            font-size: 16px;
            color: #333;
            margin: 14px 0 6px 0;
            font-style: italic;
        }

        .work-title {
            font-size: 24px;
            color: #1a1a1a;
            font-weight: bold;
            margin: 8px 0;
            max-width: 700px;
            text-align: center;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .workload {
            font-size: 19px;
            color: #333;
            margin-top: 6px;
            font-style: italic;
        }

        .workload-hours {
            font-weight: bold;
            color: #1a1a1a;
            font-style: normal;
        }

        .footer {
            margin-top: auto;
            text-align: center;
            padding-top: 10px;
        }

        .hash {
            font-size: 7.5px;
            color: #666;
            font-family: 'Courier New', monospace;
            letter-spacing: 0.3px;
            padding: 6px 10px;
            background: #f5f5f5;
            border-radius: 3px;
            max-width: 750px;
            margin: 0 auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.3;
            border: 1px solid #ddd;
        }

        .hash-label {
            font-weight: bold;
            color: #333;
            font-size: 9px;
        }

        .validation {
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
            gap: 16px;
            width: 100%;
        }

        .qr {
            width: 64px;
            height: 64px;
            flex: none;
        }

        .validation .hash {
            flex: 1;
            max-width: none;
            margin: 0;
            padding: 8px 12px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .validation-link {
            color: #1a1a1a;
            text-decoration: none;
            font-size: 9px;
        }

        .user-name.long {
            font-size: 24px;
        }

        .work-title.long {
            font-size: 17px;
            line-height: 1.3;
        }

        .decoration {
            text-align: center;
            margin: 8px 0;
            color: #8b7355;
            font-size: 12px;
            width: 100%;
        }

        .decoration::before,
        .decoration::after {
            content: '—';
            margin: 0 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="cert">
        <div class="logos">
            <img src="{{LOGO_IFC}}" alt="IFC Campus Araquari" class="logo-ifc">
            <img src="{{LOGO_FABRICA}}" alt="Fábrica de Software" class="logo-fabrica">
        </div>

        <div class="header">
            <h1>CERTIFICADO</h1>
            <p class="subtitle">de Participação</p>
        </div>

        <div class="content">
            <p class="intro">Certificamos que</p>

            <div class="user-name {{NOME_CLASSE}}">{{NOME}}</div>

            <p class="participation">participou do projeto</p>

            <div class="decoration"></div>

            <div class="work-title {{TITULO_CLASSE}}">{{TITULO}}</div>

            <p class="workload">com carga horária de <span class="workload-hours">{{CARGA_HORARIA}}</span></p>

            <div class="decoration"></div>
        </div>

        <div class="footer">
            <div class="validation">
                <img src="{{QR_CODE}}" alt="QR code de validação" class="qr">
                <div class="hash">
                    <span class="hash-label">VALIDE ESTE CERTIFICADO:</span><br>
                    <a class="validation-link" href="{{VALIDATION_URL}}">{{VALIDATION_URL}}</a><br>
                    <span class="hash-label">CÓDIGO DE VALIDAÇÃO:</span><br>
                    {{HASH}}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
