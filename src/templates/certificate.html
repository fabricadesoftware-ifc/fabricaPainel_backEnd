<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px;
        }

        .cert {
            border: 5px solid #000;
            padding: 40px;
        }

        h1 {
            font-size: 42px;
        }

        .hash {
            margin-top: 40px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="cert">
        <h1>CERTIFICADO</h1>

        <p>Certificamos que</p>

        <h2>{{ user.name }}</h2>

        <p>participou do projeto:</p>

        <h3>{{ work.title }}</h3>

        <div class="hash">
            Código de validação: {{ certificate.hash_validate }}
        </div>
    </div>
</body>
</html>
