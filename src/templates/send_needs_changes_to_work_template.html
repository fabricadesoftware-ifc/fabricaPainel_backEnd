<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }
      .header,
      .footer {
        background-color: #34a853; /* Verde escuro */
        color: #ffffff;
        padding: 10px 20px;
        text-align: center;
      }
      .container {
        width: 100%;
        padding: 20px;
        background-color: #ffffff; /* Branco */
        color: #000000;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #000000; /* Preto */
      }
      .title {
        text-transform: capitalize;
        font-size: 20px;
        color: #000000;
        padding-left: 10px;
      }
      .students-names {
        margin: 10px 0;
        color: #000000;
        background-color: white;
        padding-left: 10px;
      }
      .changes {
        margin: 10px 0;
        padding-left: 10px;
        color: #000000;
        background-color: white;
        font-size: 16px;
      }
    </style>
    <title>Work Changes</title>
  </head>
  <body>
    <div class="header">
      <h1>{{ title }}</h1>
    </div>
    <div class="container">
      <h2>Título do Trabalho:</h2>
      <h3 class="title">{{ work_title }}</h3>

      <h2>Estudantes envolvidos:</h2>
      <div class="students-names">
        {{ students_names }}
      </div>

      <h2>Mudanças necessárias:</h2>
      <div class="changes">
        <p>{{ changes }}</p>
      </div>
    </div>
    <div class="footer">
      <p>Este é um email automático. Por favor, não responda.</p>
    </div>
  </body>
</html>
