<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trabalho Cancelado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff; /* Fundo branco */
            color: #000000; /* Texto preto */
            margin: 0;
            padding: 0;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
        }
        .header {
            background-color: #28a745; /* Verde */
            color: #ffffff; /* Texto branco */
            padding: 10px;
            text-align: center;
        }
        .content {
            padding: 20px;
        }
        .content h2 {
            color: #28a745; /* Verde */
        }
        .content p {
            line-height: 1.6;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Trabalho Cancelado</h1>
        </div>
        <div class="content">
            <h2>Olá {{ work.advisor }},</h2>
            <p>Informamos que o trabalho <strong>{{ work.title }}</strong> foi cancelado pelos alunos <strong>{{ work.team }}</strong>.</p>
            <p>Se precisar de mais informações, entre em contato com os alunos ou com a administração.</p>
        </div>
        <div class="footer">
            <p>Este é um e-mail automático, por favor, não responda.</p>
        </div>
    </div>
</body>
</html>
