[project]
name = "fabrica_painel"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "lucasantonete@gmail.com", email = "lucasantonete@gmail.com"},
]
dependencies = [
    "django>=5.1.1",
    "djangorestframework>=3.15.1",
    "django-cors-headers>=4.3.1",
    "djangorestframework-simplejwt>=5.3.1",
    "setuptools>=70.0.0",
    "python-magic>=0.4.27",
    "Pillow>=10.3.0",
    "drf-spectacular>=0.27.2",
    "django-extensions>=3.2.3",
    "pygraphviz>=1.13",
    "pyparsing>=3.1.2",
    "pydot>=2.0.0",
    "django-filter>=24.2",
    "dotenv>=0.0.5",
    "python-dotenv>=1.0.1",
    "passage-identity>=2.1.4",
    "pdfplumber>=0.11.1",
    "faker>=26.0.0",
    "celery>=5.4.0",
    "django-celery-results>=2.5.1",
    "pandas>=2.2.2",
    "pyexcel-ods3>=0.6.1",
    "shell>=1.0.1",
    "unidecode>=1.3.8",
]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.scripts]
dev = "python src/manage.py runserver localhost:8000"
runserver = "python src/manage.py runserver"
createsuperuser = "python src/manage.py createsuperuser"
migrate = "python src/manage.py migrate"
makemigrations = "python src/manage.py makemigrations"
shell = "python src/manage.py shell"
populate = "python src/manage.py populate"
celery = "celery -A django_project worker -l info"
celery_beat = "celery -A src.django_project beat --loglevel=info"




[tool.pdm]
distribution = false

